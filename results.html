<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Extractor — Results</title>
  <link rel="stylesheet" href="results.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon48.png" alt="" class="logo" />
        <div>
          <h1>X Extractor</h1>
          <p class="subtitle" id="contextLine">Waiting for extraction…</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="stopBtn" class="btn btn-warn" style="display:none;">Stop</button>
        <button id="refreshBtn" class="btn btn-ghost">Refresh</button>
      </div>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">Posts</div>
        <div class="stat-value" id="statPosts">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total views</div>
        <div class="stat-value" id="statViews">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total engagement</div>
        <div class="stat-value" id="statEng">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Avg engagement rate</div>
        <div class="stat-value" id="statRate">0%</div>
      </div>
    </section>

    <section class="toolbar">
      <div class="sort-group">
        <span class="toolbar-label">Sort by</span>
        <select id="sortSelect" class="select">
          <option value="views">Views</option>
          <option value="engagement">Engagement</option>
          <option value="engagementRatio">Engagement rate</option>
          <option value="likes">Likes</option>
          <option value="postedAt">Most recent</option>
        </select>
      </div>
      <div class="toolbar-actions">
        <button id="exportBtn" class="btn btn-ghost">Export CSV</button>
        <button id="copyJsonBtn" class="btn btn-ghost">Copy JSON</button>
        <button id="clearBtn" class="btn btn-danger">Clear</button>
      </div>
    </section>

    <main id="postsList" class="posts"></main>

    <div id="emptyState" class="empty">
      <p>No posts yet. Open the extension popup, pick an X tab, and click <strong>Extract</strong>.</p>
    </div>
  </div>

  <script src="results.js"></script>
</body>
</html>
